<title>hq tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* hq tracker — temă alb-negru (stil Uber), mobile-first.
   Layout: bară de jos + FAB pe telefon, meniu lateral pe desktop. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

:root {
  --bg: #ffffff; --fg: #000000;
  --surface: #f3f3f3; --surface-2: #e8e8e8;
  --line: #e6e6e6; --muted: #6b6b6b; --muted-2: #a6a6a6; --bar-2: #c4c4c4;
  --hatch: #555555; --hover-dark: #222222;
  --hero-line: rgba(255,255,255,.18); --inv-track: rgba(255,255,255,.2);
  --backdrop: rgba(0,0,0,.5); --fab-shadow: rgba(0,0,0,.25); --lift-shadow: rgba(0,0,0,.06);
  --radius: 16px; --radius-sm: 10px;
  --sidebar: 256px; --tabbar: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --fg: #ffffff;
    --surface: #161616; --surface-2: #262626;
    --line: #242424; --muted: #9a9a9a; --muted-2: #6f6f6f; --bar-2: #444444;
    --hatch: #9a9a9a; --hover-dark: #e0e0e0;
    --hero-line: rgba(0,0,0,.14); --inv-track: rgba(0,0,0,.14);
    --backdrop: rgba(0,0,0,.7); --fab-shadow: rgba(0,0,0,.6); --lift-shadow: rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --fg: #ffffff;
  --surface: #161616; --surface-2: #262626;
  --line: #242424; --muted: #9a9a9a; --muted-2: #6f6f6f; --bar-2: #444444;
  --hatch: #9a9a9a; --hover-dark: #e0e0e0;
  --hero-line: rgba(0,0,0,.14); --inv-track: rgba(0,0,0,.14);
  --backdrop: rgba(0,0,0,.7); --fab-shadow: rgba(0,0,0,.6); --lift-shadow: rgba(0,0,0,.4);
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--fg);
  font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
body.locked { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Layout ---------- */
.app { min-height: 100dvh; }
.sidebar { display: none; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px 12px;
}
.topbar h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titles { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.top-date { font-size: 13px; font-weight: 600; background: var(--surface); border-radius: 999px; padding: 8px 12px; white-space: nowrap; text-transform: capitalize; }

main { padding: 4px 16px calc(var(--tabbar) + var(--safe-b) + 96px); max-width: 1120px; margin: 0 auto; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--bg); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tabbar) + var(--safe-b)); padding-bottom: var(--safe-b);
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted-2); }
.tab.active { color: var(--fg); font-weight: 700; }

.fab {
  position: fixed; z-index: 31; right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(var(--tabbar) + var(--safe-b) + 16px);
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--fg); color: var(--bg); display: grid; place-items: center;
  box-shadow: 0 6px 20px var(--fab-shadow);
}

/* ---------- Componente ---------- */
.section { margin-top: 28px; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; margin-bottom: 8px; }
.section-head h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.link { font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 12px; }

.notice {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 14px; margin-bottom: 14px; font-size: 14px;
}
.notice .link { white-space: nowrap; }

.hero { background: var(--fg); color: var(--bg); border-radius: var(--radius); padding: 20px; }
.hero-label { font-size: 14px; color: var(--muted-2); font-weight: 500; }
.hero-big { font-size: 36px; font-weight: 800; letter-spacing: -0.035em; margin-top: 4px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-sub { font-size: 14px; color: var(--muted-2); margin: 4px 0 16px; font-variant-numeric: tabular-nums; }
.hero-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hero-line); }
.hero-split span { display: block; font-size: 12px; color: var(--muted-2); }
.hero-split b { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted-2); margin-top: 8px; }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list .row:last-child { border-bottom: 0; }
a.row:active { background: var(--surface); }
.avatar { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.avatar.dark { background: var(--fg); color: var(--bg); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row-end b { font-weight: 700; }
.row-end small { font-size: 12px; color: var(--muted); }
.chev { color: var(--muted-2); display: grid; }

.ms { display: block; width: 100%; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ms:last-child { border-bottom: 0; }
.ms-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.ms-top span:first-child { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-val { font-size: 14px; color: var(--muted); white-space: nowrap; }
.ms-val b { color: var(--fg); }
.ms-sub { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }

.progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--fg); border-radius: 99px; transition: width .3s; }
.progress.over > i { background: repeating-linear-gradient(45deg, var(--fg) 0 6px, var(--hatch) 6px 12px); }
.progress.inv { background: var(--inv-track); }
.progress.inv > i { background: var(--bg); }

.seg { display: flex; background: var(--surface); border-radius: 999px; padding: 4px; }
.seg button { flex: 1; padding: 9px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); min-height: 40px; }
.seg button.on { background: var(--fg); color: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; background: var(--surface); font-weight: 500; font-size: 14px; min-height: 36px; }
.chip.on { background: var(--fg); color: var(--bg); }

.btn { height: 48px; padding: 0 20px; border-radius: var(--radius-sm); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--fg); color: var(--bg); }
.btn.primary:hover { background: var(--hover-dark); }
.btn.block { width: 100%; }
.btn.danger { background: transparent; text-decoration: underline; text-underline-offset: 3px; }
.btn.armed { background: var(--fg); color: var(--bg); text-decoration: none; }
.link.armed { text-decoration: none; background: var(--fg); color: var(--bg); padding: 2px 8px; border-radius: 6px; }
.icon-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); }
.action-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; margin-top: 12px; }
.add-under { margin-top: 12px; }
.badge { display: inline-block; vertical-align: middle; margin-left: 6px; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--fg); color: var(--bg); }
.badge.ghost { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input {
  width: 100%; height: 48px; border-radius: var(--radius-sm);
  background: var(--surface); border: 2px solid transparent;
  padding: 0 14px; font-size: 16px; outline: none; appearance: none;
}
.field input:focus { border-color: var(--fg); background-color: var(--bg); }
.actions { display: flex; gap: 8px; margin-top: 4px; }
.actions .btn.primary { flex: 1; }
.info { font-size: 13px; color: var(--muted); background: var(--surface); border-radius: var(--radius-sm); padding: 10px 14px; }

.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); animation: fade .2s ease; }
.sheet-panel {
  position: relative; width: 100%; max-height: 92dvh; overflow-y: auto;
  background: var(--bg); border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(20px + var(--safe-b)); animation: up .25s var(--ease);
}
.grabber { width: 40px; height: 4px; border-radius: 4px; background: var(--surface-2); margin: 4px auto 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.sheet-head h2 { font-size: 20px; font-weight: 700; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; background: var(--surface); border-radius: var(--radius); padding: 14px 16px; }
.tile:last-child { grid-column: span 2; }
.tile-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.tile b { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tile-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.day { margin-top: 12px; }
.day-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--line); text-transform: capitalize; }

/* Șir de praguri (detaliu) */
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.step { border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface); }
.step b { display: block; font-size: 15px; font-weight: 700; }
.step small { font-size: 12px; color: var(--muted); }
.step.done { background: var(--fg); color: var(--bg); }
.step.done small { color: var(--muted-2); }
.step.next { box-shadow: inset 0 0 0 2px var(--fg); background: var(--bg); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); margin-bottom: 2px; }
.empty .btn { margin-top: 14px; }
.grid-2 { display: block; }

.logo { display: grid; place-items: center; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; background: var(--fg); color: var(--bg); font-size: 17px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.logo.sm { width: 20px; height: 20px; border-radius: 6px; font-size: 10px; }
.m-brand { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }

/* ---------- Animații ---------- */
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes down { to { transform: translateY(100%); } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes tabPop { 40% { transform: translateY(-3px) scale(1.12); } }
@keyframes titleIn { from { opacity: 0; transform: translateX(-8px); } }
.rise { animation: rise .5s var(--ease) backwards; }
#view.enter .progress > i { transform-origin: left; animation: grow .9s var(--ease) .15s backwards; }
#title.anim { animation: titleIn .35s var(--ease) backwards; }
.btn, .tile, .chip, .seg button, .fab, .icon-btn, a.row, .step {
  transition: transform .12s ease, background-color .15s ease, color .15s ease, box-shadow .2s ease;
}
.btn:active, .tile:active, .chip:active, .seg button:active, .icon-btn:active, .fab:active { transform: scale(.97); }
.tab svg { transition: transform .2s; }
.tab.active svg { animation: tabPop .35s var(--ease); }
.fab { animation: rise .5s var(--ease) .2s backwards; }
.fab:hover { transform: rotate(90deg); }
.sheet.closing .sheet-backdrop { animation: fadeOut .2s ease forwards; }
.sheet.closing .sheet-panel { animation: down .22s ease-in forwards; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.toast {
  position: fixed; left: 50%; z-index: 60; bottom: calc(var(--tabbar) + var(--safe-b) + 90px);
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--fg); color: var(--bg); font-weight: 600; font-size: 14px;
  padding: 10px 18px; border-radius: 999px; transition: .2s; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Desktop ---------- */
@media (hover: hover) {
  a.row:hover { background: var(--surface); }
  a.row { border-radius: 8px; padding-left: 8px; padding-right: 8px; margin: 0 -8px; width: calc(100% + 16px); }
}
@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: var(--sidebar) 1fr; }
  .sidebar { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100dvh; border-right: 1px solid var(--line); padding: 28px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .brand-text { font-size: 15px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
  .brand-text small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .m-brand { display: none; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; }
  .side-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--radius-sm); font-weight: 500; color: var(--muted); }
  .side-item:hover { background: var(--surface); color: var(--fg); }
  .side-item.active { background: var(--surface); color: var(--fg); font-weight: 700; }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 8px; }
  .tabbar, .fab { display: none; }
  .content { min-width: 0; }
  .topbar { top: 0; padding: 32px 40px 16px; max-width: 1120px; margin: 0 auto; }
  .topbar h1 { font-size: 34px; }
  main { padding: 8px 40px 56px; }
  .grid-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; align-items: start; }
  .grid-2 > div > .section:first-child { margin-top: 0; }
  .hero-big { font-size: 44px; }
  .tiles { grid-template-columns: repeat(3, 1fr); margin-top: 12px; }
  .tile:last-child { grid-column: auto; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px var(--lift-shadow); background: var(--surface-2); }
  .sheet { align-items: center; }
  .sheet-panel { max-width: 480px; border-radius: 20px; padding: 20px 24px 24px; animation: pop .22s var(--ease); }
  .sheet.closing .sheet-panel { animation: popOut .18s ease forwards; }
  .grabber { display: none; }
  .toast { bottom: 32px; }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } }
  @keyframes popOut { to { transform: scale(.96); opacity: 0; } }
}
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">hq</span><span class="brand-text">hq tracker<small>obiceiuri bune și rele</small></span></div>
    <button class="btn primary block" data-action="add">+ Adaugă obicei</button>
    <nav class="side-nav" id="sideNav"></nav>
    <p class="side-foot">Datele stau doar în acest browser, pe acest dispozitiv.</p>
  </aside>
  <div class="content">
    <header class="topbar">
      <button class="icon-btn" id="backBtn" data-action="back" aria-label="Înapoi" hidden></button>
      <div class="titles">
        <span class="m-brand"><span class="logo sm">hq</span>hq tracker</span>
        <h1 id="title">Acasă</h1>
      </div>
      <span class="top-date" id="topDate"></span>
    </header>
    <main id="view"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <button class="fab" data-action="add" aria-label="Adaugă obicei"></button>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status"></div>

<script>
/* ---------- Helper-e UI ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  ban: '<circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  close: '<path d="M18 6 6 18M6 6l12 12"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
};
const icon = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
let sheetTimer;
function openSheet(title, html, mount) {
  const el = $('#sheet'); clearTimeout(sheetTimer); el.classList.remove('closing');
  el.innerHTML = `<div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grabber"></div>
      <div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close-sheet" aria-label="Închide">${icon('close', 20)}</button></div>
      ${html}
    </div>`;
  el.hidden = false; document.body.classList.add('locked');
  if (mount) mount(el);
}
function closeSheet() {
  const el = $('#sheet');
  if (el.hidden || el.classList.contains('closing')) return;
  document.body.classList.remove('locked');
  const finish = () => { el.hidden = true; el.innerHTML = ''; el.classList.remove('closing'); };
  if (reducedMotion()) return finish();
  el.classList.add('closing'); sheetTimer = setTimeout(finish, 220);
}
function armed(el, label) {
  if (el.dataset.armed) return true;
  el.dataset.armed = '1'; el.dataset.orig = el.textContent; el.textContent = label; el.classList.add('armed');
  setTimeout(() => {
    if (!el.isConnected || !el.dataset.armed) return;
    delete el.dataset.armed; el.textContent = el.dataset.orig; el.classList.remove('armed');
  }, 4000);
  return false;
}
function stagger(root, selector = '.notice, .hero, .tile, .section, .action-row, .day') {
  let i = 0;
  root.querySelectorAll(selector).forEach(el => { el.classList.add('rise'); el.style.animationDelay = `${Math.min(i++ * 45, 500)}ms`; });
}
const NUMFMT = {};
function countUp(root, selector = '.tile b, .hero-split b[data-count]') {
  if (reducedMotion()) return;
  root.querySelectorAll(selector).forEach(el => {
    const text = el.textContent;
    const m = text.match(/\d[\d.]*(?:,\d+)?/); if (!m) return;
    const dec = (m[0].split(',')[1] || '').length;
    const target = parseFloat(m[0].replace(/\./g, '').replace(',', '.')); if (!target) return;
    const fmt = NUMFMT[dec] ||= new Intl.NumberFormat('ro-RO', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const pre = text.slice(0, m.index), post = text.slice(m.index + m[0].length);
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = p < 1 ? pre + fmt.format(target * (1 - Math.pow(1 - p, 3))) + post : text;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });

/* ---------- Date ---------- */
const KEY = 'hq-tracker-v1';

/* ---------- Format ---------- */
const pad = n => String(n).padStart(2, '0');

// română: 1 zi, 2–19 zile, 20+ „de zile” (după ultimele două cifre)
function pl(n, one, many) {
  if (n === 1) return `1 ${one}`;
  const r = n % 100;
  return `${nf.format(n)} ${(r === 0 && n > 0) || r >= 20 ? 'de ' : ''}${many}`;
}
const zile = n => pl(n, 'zi', 'zile');
function parts(ms) {
  ms = Math.max(0, ms);

}

const initials = s => s.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();

/* ---------- Logica obiceiurilor ---------- */
const cur = h => Date.now() - h.start;
const best = h => Math.max(h.best || 0, cur(h));

const MS = [[1, '1 zi'], [3, '3 zile'], [7, '1 săpt.'], [14, '2 săpt.'], [30, '1 lună'], [60, '2 luni'], [90, '3 luni'], [180, '6 luni'], [365, '1 an'], [730, '2 ani'], [1095, '3 ani']];
function milestones(days) {
  const list = MS.slice();
  for (let y = 4; list[list.length - 1][0] <= days; y++) list.push([365 * y, `${y} ani`]);
  return list;
}

  const days = ms / D, list = milestones(days);
  const i = list.findIndex(([d]) => d > days);
  const prev = i > 0 ? list[i - 1][0] : 0, next = list[i];
  return { next, prev, pct: Math.min(100, (days - prev) / (next[0] - prev) * 100), leftMs: next[0] * D - ms, list, reached: i };

  const activeTab = r.name === 'detail' ? (out.back || '#acasa').slice(1) : r.name;
  document.querySelectorAll('[data-tab]').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
  v.classList.remove('enter');

}
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach(el => {
    const ms = now - Number(el.dataset.since);
    const f = el.dataset.fmt;
    el.textContent = f === 'clock' ? clock(ms) : f === 'days' ? zile(parts(ms).d) : f === 'money' ? money(Number(el.dataset.cost) * ms / D) : short(ms);
  });
}

      const c = e.target.closest('[data-suggest]'); if (!c) return;
      $('#fName', el).value = c.dataset.suggest;
      el.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    });
    sync();
    if (!h && matchMedia('(hover: hover)').matches) $('#fName', el).focus();
  });
}
function resetForm(h) {
  openSheet(verbFail(h), `
    <form class="form" id="resetForm" data-id="${h.id}">
      <p class="info">Seria de ${short(cur(h))} se salvează în istoric și contorul pornește din nou. Recordul tău rămâne: ${short(best(h))}.</p>
      <div class="field"><label class="label" for="rAt">Când?</label><input id="rAt" type="datetime-local" value="${toLocalInput(Date.now())}"></div>
      <div class="field"><label class="label" for="rNote">Ce s-a întâmplat? (opțional)</label><input id="rNote" maxlength="120" autocomplete="off" placeholder="ex. stres la muncă"></div>
      <div class="actions"><button class="btn primary" type="submit">Resetează contorul</button></div>
    </form>`);
}
function parseLocal(v) { const t = new Date(v).getTime(); return isNaN(t) ? Date.now() : Math.min(t, Date.now()); }

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'habitForm') {
    const name = $('#fName', f).value.trim();
    if (!name) { $('#fName', f).focus(); return toast('Scrie un nume'); }
    const kind = $('#fKind', f).value, start = parseLocal($('#fStart', f).value);
    const cost = kind === 'bad' ? Math.max(0, parseFloat($('#fCost', f).value) || 0) || null : null;
    if (f.dataset.id) {
      Object.assign(byId(f.dataset.id), { name, kind, start, cost });
      save(); closeSheet(); render(); toast('Salvat');
    } else {
      const h = { id: uid(), name, kind, start, cost, resets: [], best: 0 };
      habits.push(h); save(); closeSheet(); toast('Adăugat');
      location.hash = 'obicei-' + h.id;
    }
  }
  if (f.id === 'resetForm') {
    const h = byId(f.dataset.id); if (!h) return;
    const at = Math.max(h.start, parseLocal($('#rAt', f).value));
    const streak = at - h.start;
    h.resets.push({ at, streak, note: $('#rNote', f).value.trim() });
    h.best = Math.max(h.best || 0, streak);
    h.start = at;
    save(); closeSheet(); render(true); toast('Contorul a pornit din nou');
  }
});

document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action, h = a.dataset.id && byId(a.dataset.id);
  if (act === 'close-sheet') closeSheet();
  if (act === 'add') habitForm(null, a.dataset.kind);
  if (act === 'edit' && h) habitForm(h);
  if (act === 'reset' && h) resetForm(h);
  if (act === 'back') location.hash = a.dataset.href || 'acasa';
  if (act === 'delete' && h) {
    if (!armed(a, 'Apasă din nou ca să ștergi')) return;
    habits = habits.filter(x => x !== h); save(); toast('Șters');
    location.hash = h.kind === 'bad' ? 'rele' : 'bune';
  }
  if (act === 'clear-examples') {
    if (!armed(a, 'Apasă din nou')) return;
    habits = habits.filter(x => !x.example); save(); render(true); toast('Exemplele au fost șterse');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- Pornire ---------- */
$('#tabbar').innerHTML = TABS.map(t => `<a class="tab" data-tab="${t.id}" href="#${t.id}">${icon(t.ico)}<span>${t.label}</span></a>`).join('');
$('#sideNav').innerHTML = TABS.map(t => `<a class="side-item" data-tab="${t.id}" href="#${t.id}">${icon(t.ico, 20)}<span>${t.label}</span></a>`).join('');
$('.fab').innerHTML = icon('plus', 26);
$('#backBtn').innerHTML = icon('back', 20);
$('#topDate').textContent = new Date().toLocaleDateString('ro-RO', { weekday: 'short', day: 'numeric', month: 'short' });
window.addEventListener('hashchange', () => { closeSheet(); render(true); scrollTo(0, 0); });
render(true);
setInterval(tick, 1000);
</script>
